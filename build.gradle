plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.rtyley' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Required: Iskandert's Library (local build preferred)
    def iskaLibJar = file('../Iskandert-Library/build/libs/iska_lib-1.14.0.1.0.jar')
    if (!iskaLibJar.exists()) {
        iskaLibJar = file('../Iskandert-Library/build/libs/iska_lib-1.14.0.0.0.jar')
    }
    if (!iskaLibJar.exists()) {
        iskaLibJar = file('libs/iska_lib-1.14.0.1.0.jar')
    }
    if (!iskaLibJar.exists()) {
        iskaLibJar = file('libs/iska_lib-1.14.0.0.0.jar')
    }
    if (iskaLibJar.exists()) {
        implementation files(iskaLibJar)
        localRuntime files(iskaLibJar)
    } else {
        throw new GradleException('Missing local iska_lib jar (build Iskandert-Library or place jar in libs/)')
    }

    // Required: Another Config Manager (local build preferred)
    def acmJar = file('../AnotherConfigManager-26.1.2/build/libs/another_config_manager-1.0.0.0.0.jar')
    if (!acmJar.exists()) {
        acmJar = file('../AnotherConfigManager-26.1.2/build/libs/another_config_manager-1.0.0.0.0-neoforge-26.1.2.jar')
    }
    if (!acmJar.exists()) {
        acmJar = file('libs/another_config_manager-1.0.0.0.0.jar')
    }
    if (acmJar.exists()) {
        implementation files(acmJar)
        localRuntime files(acmJar)
    } else {
        throw new GradleException('Missing local another_config_manager jar')
    }

    // Optional local mods (runtime for IDE testing; not required to compile core).
    // Prefer newest jar per mod id — avoid loading two versions of the same mod.
    def pickFirstExisting = { List paths ->
        for (String path : paths) {
            def jar = file(path)
            if (jar.exists()) {
                return jar
            }
        }
        return null
    }
    def optionalLocal = [
            pickFirstExisting([
                    '../iskandert_utilities_26/build/libs/iska_utils-3.13.0.0.1-neoforge-26.1.2.jar',
                    '../iskandert_utilities_26/build/libs/iska_utils-3.13.0.0.0-neoforge-26.1.2.jar',
            ]),
            pickFirstExisting([
                    '../Colossal-Reactors-26/build/libs/colossal_reactors-2.6.0.1.0.jar',
                    // '../Colossal-Reactors-26/build/libs/colossal_reactors-2.6.0.0.0-neoforge-26.1.2.jar',
            ]),
            pickFirstExisting([
                    '../Replication-AE2-Bridge-26.1.2/build/libs/rep_ae2_bridge-3.2.0.2.1.jar',
                    '../Replication-AE2-Bridge/build/libs/rep_ae2_bridge-3.2.0.2.1.jar',
                    // '../Replication-AE2-Bridge-26.1.2/build/libs/rep_ae2_bridge-3.2.0.0.1-neoforge-26.1.2.jar',
                    // '../Replication-AE2-Bridge-26.1.2/build/libs/rep_ae2_bridge-3.2.0.0.0-neoforge-26.1.2.jar',
            ]),
    ]
    optionalLocal.findAll { it != null }.each { jar ->
        localRuntime files(jar)
    }

    // Bridge + textures stack (Titanium → Replication; AE2; Fusion CT)
    localRuntime "curse.maven:titanium-287342:${titanium_file_id}"
    localRuntime "curse.maven:replication-638351:${replication_file_id}"
    localRuntime "curse.maven:applied-energistics-2-223794:${ae2_file_id}"
    localRuntime "curse.maven:guideme-1173950:${guideme_file_id}"
    localRuntime "curse.maven:fusion-connected-textures-854949:${fusion_file_id}"

    // Soft runtime deps often pulled by Library integrations during local runs
    localRuntime "dev.ftb.mods:ftb-library-neoforge:26.1.2.7"
    localRuntime "dev.ftb.mods:ftb-teams-neoforge:26.1.2.4"

    // Recipe viewers — compile APIs always; one localRuntime via runtime_itemlist_mod
    def itemListMod = findProperty('runtime_itemlist_mod') ?: 'jei'
    compileOnly "curse.maven:jei-238222:${jei_file_id}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    // EMI predisposed (no stable 26.1.2 yet)
    compileOnly "curse.maven:${emi_mod_maven}:${emi_file_id}"

    if (itemListMod == 'jei') {
        localRuntime "curse.maven:jei-238222:${jei_file_id}"
    } else if (itemListMod == 'rei') {
        localRuntime "curse.maven:roughly-enough-items-310111:${rei_curse_file}"
        localRuntime "curse.maven:architectury-api-419699:${architectury_curse_file}"
        localRuntime "curse.maven:cloth-config-348521:${cloth_config_curse_file}"
    } else if (itemListMod == 'emi') {
        // Predisposed — enable when a usable 26.1.2 EMI artifact exists
        localRuntime "curse.maven:${emi_mod_maven}:${emi_file_id}"
    }
    // itemListMod == 'none' → compileOnly only

    //Fast*: compileAlways. Runtime: FastFurnace ON (gate under test); FastWorkbench OFF so vanilla crafting table is tested.
    compileOnly "curse.maven:fastworkbench-288885:${fastworkbench_file_id}"
    compileOnly "curse.maven:fastfurnace-299540:${fastfurnace_file_id}"
    localRuntime "curse.maven:fastworkbench-288885:${fastworkbench_file_id}"
    localRuntime "curse.maven:fastfurnace-299540:${fastfurnace_file_id}"
    localRuntime "curse.maven:placebo-283644:${placebo_file_id}"

    // Polymorph+ (Aminoquiz fork) — 26.1.2 uses mod id polymorph_plus; filter stage-locked conflict candidates.
    compileOnly "curse.maven:polymorph-plus-1586874:${polymorph_plus_file_id}"
    localRuntime "curse.maven:polymorph-plus-1586874:${polymorph_plus_file_id}"

    // Jade — stage_block / stage_item tooltip disguise
    compileOnly "curse.maven:jade-324717:${jade_file_id}"
    localRuntime "curse.maven:jade-324717:${jade_file_id}"

    // KubeJS — compile API from Latvian Maven; CurseMaven runtimes (Rhino + BAT required)
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    if (configurations.findByName('interfaceInjectionData') != null) {
        interfaceInjectionData "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    }
    localRuntime "curse.maven:kubejs-238086:${kubejs_file_id}"
    localRuntime "curse.maven:rhino-416294:${rhino_file_id}"
    localRuntime "curse.maven:better-advanced-tooltips-1637623:${bat_file_id}"
    // Transitive runtime libs from KubeJS POM (not on CurseMaven)
    localRuntime "dev.latvian.apps:tiny-java-server:1.0.0-build.45"
    localRuntime "com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7"

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation 'io.github.llamalad7:mixinextras-neoforge:0.5.5'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(
            '-AoutRefMapFile=' + layout.buildDirectory.file("${mod_id}.refmap.json").get().asFile.absolutePath,
            '-Amixin.configs=' + mod_id + '.mixins.json'
    )
}

tasks.named('jar', Jar).configure {
    def mid = project.mod_id
    from(layout.buildDirectory.file("${mid}.refmap.json")) {
        rename { "${mid}.refmap.json" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
