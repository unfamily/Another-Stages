plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.rtyley' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users on 1.21.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Required: Iskandert's Library (1.21.1 twin)
    def iskaLibJar = file('../Iskandert-Library-1.21.1/build/libs/iska_lib-1.14.0.1.0.jar')
    if (!iskaLibJar.exists()) {
        iskaLibJar = file('../Iskandert-Library-1.21.1/build/libs/iska_lib-1.14.0.0.0.jar')
    }
    if (!iskaLibJar.exists()) {
        iskaLibJar = file('libs/iska_lib-1.14.0.1.0.jar')
    }
    if (iskaLibJar.exists()) {
        implementation files(iskaLibJar)
        localRuntime files(iskaLibJar)
    } else {
        throw new GradleException('Missing local iska_lib jar (build Iskandert-Library-1.21.1 or place jar in libs/)')
    }

    // Required: Another Config Manager (1.21.1)
    def acmJar = file('../AnotherConfigManager/build/libs/another_config_manager-1.1.0.0.0.jar')
    if (!acmJar.exists()) {
        acmJar = file('../AnotherConfigManager/build/libs/another_config_manager-1.1.0.0.0-neoforge-1.21.1.jar')
    }
    if (!acmJar.exists()) {
        acmJar = file('../AnotherConfigManager/build/libs/another_config_manager-1.0.0.0.0.jar')
    }
    if (!acmJar.exists()) {
        acmJar = file('../AnotherConfigManager/build/libs/another_config_manager-1.0.0.0.0-neoforge-1.21.1.jar')
    }
    if (!acmJar.exists()) {
        acmJar = file('libs/another_config_manager-1.1.0.0.0.jar')
    }
    if (!acmJar.exists()) {
        acmJar = file('libs/another_config_manager-1.0.0.0.0.jar')
    }
    if (acmJar.exists()) {
        implementation files(acmJar)
        localRuntime files(acmJar)
    } else {
        throw new GradleException('Missing local another_config_manager jar')
    }

    def pickFirstExisting = { List paths ->
        for (String path : paths) {
            def jar = file(path)
            if (jar.exists()) {
                return jar
            }
        }
        return null
    }
    def optionalLocal = [
            pickFirstExisting([
                    '../iskandert_utilities/build/libs/iska_utils-3.13.0.1.1.jar',
                    '../iskandert_utilities/build/libs/iska_utils-3.13.0.1.0.jar',
            ]),
            pickFirstExisting([
                    'libs/colossal_reactors-2.6.0.1.1.jar',
                    'libs/colossal_reactors-2.6.0.1.0.jar',
                    '../Colossal-Reactors/build/libs/colossal_reactors-2.6.0.1.1.jar',
                    '../Colossal-Reactors/build/libs/colossal_reactors-2.6.0.1.0.jar',
            ]),
            pickFirstExisting([
                    'libs/rep_ae2_bridge-3.2.0.2.2.jar',
                    '../Replication-AE2-Bridge/build/libs/rep_ae2_bridge-3.2.0.2.2.jar',
                    '../Replication-AE2-Bridge/build/libs/rep_ae2_bridge-3.2.0.2.1.jar',
            ]),
    ]
    optionalLocal.findAll { it != null }.each { jar ->
        localRuntime files(jar)
    }

    // Soft runtime deps for optional local mods (Utils / Colossal / Bridge)
    localRuntime "curse.maven:fusion-connected-textures-854949:${fusion_file_id}"
    localRuntime "curse.maven:titanium-287342:${titanium_file_id}"
    localRuntime "curse.maven:replication-638351:${replication_file_id}"
    compileOnly "curse.maven:iron-furnaces-237664:${ironfurnaces_file_id}"
    localRuntime "curse.maven:iron-furnaces-237664:${ironfurnaces_file_id}"

    compileOnly "curse.maven:applied-energistics-2-223794:${ae2_file_id}"

    localRuntime "curse.maven:applied-energistics-2-223794:${ae2_file_id}"
    compileOnly "curse.maven:extendedae-892005:${extendedae_file_id}"
    localRuntime "curse.maven:extendedae-892005:${extendedae_file_id}"
    compileOnly "curse.maven:glodium-957920:${glodium_file_id}"
    localRuntime "curse.maven:glodium-957920:${glodium_file_id}"
    compileOnly "curse.maven:advancedae-1084104:${advancedae_file_id}"
    // JarJar'd into AdvancedAE on 1.21.1 — needed so QuantumCrafterEntity hierarchy resolves at compile
    compileOnly files('libs/ae2addonlib-1.0.3-1.21.1.jar')
    localRuntime "curse.maven:advancedae-1084104:${advancedae_file_id}"
    localRuntime "curse.maven:geckolib-388172:${geckolib_file_id}"
    compileOnly "curse.maven:refined-storage-243076:${refinedstorage_file_id}"
    localRuntime "curse.maven:refined-storage-243076:${refinedstorage_file_id}"
    compileOnly "curse.maven:toms-storage-378609:${toms_storage_file_id}"
    localRuntime "curse.maven:toms-storage-378609:${toms_storage_file_id}"
    compileOnly "curse.maven:sophisticated-core-618298:${sophisticatedcore_file_id}"
    localRuntime "curse.maven:sophisticated-core-618298:${sophisticatedcore_file_id}"
    compileOnly "curse.maven:sophisticated-backpacks-422301:${sophisticatedbackpacks_file_id}"
    localRuntime "curse.maven:sophisticated-backpacks-422301:${sophisticatedbackpacks_file_id}"
    compileOnly "curse.maven:sophisticated-storage-619320:${sophisticatedstorage_file_id}"
    localRuntime "curse.maven:sophisticated-storage-619320:${sophisticatedstorage_file_id}"
    // Flat endercore (nested jarjar) so MachineTaskHostMixin can type EnderBlockEntity
    compileOnly files('libs/enderio-flat')
    compileOnly "curse.maven:enderio-64578:${enderio_file_id}"
    localRuntime "curse.maven:enderio-64578:${enderio_file_id}"
    compileOnly "curse.maven:energized-power-782147:${energizedpower_file_id}"
    localRuntime "curse.maven:energized-power-782147:${energizedpower_file_id}"
    compileOnly "curse.maven:create-328085:${create_file_id}"
    localRuntime "curse.maven:create-328085:${create_file_id}"
    // Create Alta addons (NeoForge 1.21.1) — slightly below latest when available
    compileOnly "maven.modrinth:createaddition:${createaddition_version}"
    localRuntime "maven.modrinth:createaddition:${createaddition_version}"
    compileOnly "maven.modrinth:slice-and-dice:${sliceanddice_version}"
    localRuntime "maven.modrinth:slice-and-dice:${sliceanddice_version}"
    compileOnly "maven.modrinth:create-dragons-plus:${create_dragons_plus_version}"
    localRuntime "maven.modrinth:create-dragons-plus:${create_dragons_plus_version}"
    compileOnly "maven.modrinth:create-enchantment-industry:${create_enchantment_industry_version}"
    localRuntime "maven.modrinth:create-enchantment-industry:${create_enchantment_industry_version}"
    compileOnly "maven.modrinth:create-central-kitchen:${create_central_kitchen_version}"
    localRuntime "maven.modrinth:create-central-kitchen:${create_central_kitchen_version}"
    compileOnly files('libs/esl-neoforge-1.21.1-1.0.3.jar')
    compileOnly "maven.modrinth:create-new-age:${create_new_age_version}"
    localRuntime "maven.modrinth:create-new-age:${create_new_age_version}"
    compileOnly "maven.modrinth:farmers-delight:${farmersdelight_version}"
    localRuntime "maven.modrinth:farmers-delight:${farmersdelight_version}"
    compileOnly "curse.maven:crafting-station-318551:${craftingstation_file_id}"
    localRuntime "curse.maven:crafting-station-318551:${craftingstation_file_id}"
    compileOnly "curse.maven:forestry-community-edition-1056828:${forestry_file_id}"
    localRuntime "curse.maven:forestry-community-edition-1056828:${forestry_file_id}"
    localRuntime "curse.maven:patchouli-306770:${patchouli_file_id}"
    compileOnly "curse.maven:cyclops-core-232758:${cyclopscore_file_id}"
    localRuntime "curse.maven:cyclops-core-232758:${cyclopscore_file_id}"
    compileOnly "curse.maven:common-capabilities-247007:${commoncapabilities_file_id}"
    localRuntime "curse.maven:common-capabilities-247007:${commoncapabilities_file_id}"
    compileOnly "curse.maven:integrated-dynamics-236307:${integrateddynamics_file_id}"
    localRuntime "curse.maven:integrated-dynamics-236307:${integrateddynamics_file_id}"
    compileOnly "curse.maven:integrated-crafting-287357:${integratedcrafting_file_id}"
    localRuntime "curse.maven:integrated-crafting-287357:${integratedcrafting_file_id}"
    localRuntime "curse.maven:guideme-1173950:${guideme_file_id}"

    // Soft runtime deps often pulled by Library integrations
    localRuntime "curse.maven:ftb-library-forge-404465:8569579"
    localRuntime "curse.maven:ftb-teams-forge-404468:8724782"
    localRuntime "curse.maven:architectury-api-419699:${architectury_curse_file}"

    // Recipe viewers
    def itemListMod = findProperty('runtime_itemlist_mod') ?: 'jei'
    compileOnly "curse.maven:jei-238222:${jei_file_id}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly "curse.maven:${emi_mod_maven}:${emi_file_id}"

    if (itemListMod == 'jei') {
        localRuntime "curse.maven:jei-238222:${jei_file_id}"
        // AE2 19.2.x dropped built-in JEI categories (Inscriber etc.); restore via companion mod
        localRuntime "curse.maven:mezzconfig-1689768:${mezzconfig_file_id}"
        localRuntime "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_file_id}"
    } else if (itemListMod == 'rei') {
        localRuntime "curse.maven:roughly-enough-items-310111:${rei_curse_file}"
        localRuntime "curse.maven:architectury-api-419699:${architectury_curse_file}"
        localRuntime "curse.maven:cloth-config-348521:${cloth_config_curse_file}"
    } else if (itemListMod == 'emi') {
        localRuntime "curse.maven:${emi_mod_maven}:${emi_file_id}"
    }

    // Fast* + Placebo + Polymorph — localRuntime for recipe-gate testing
    compileOnly "curse.maven:fastworkbench-288885:${fastworkbench_file_id}"
    compileOnly "curse.maven:fastfurnace-299540:${fastfurnace_file_id}"
    localRuntime "curse.maven:fastworkbench-288885:${fastworkbench_file_id}"
    localRuntime "curse.maven:fastfurnace-299540:${fastfurnace_file_id}"
    localRuntime "curse.maven:placebo-283644:${placebo_file_id}"

    // Polymorph / Polymorph+ — exclusive via runtime_polymorph_mod (plus | classic | none).
    def polymorphMod = (findProperty('runtime_polymorph_mod') ?: 'plus').toString()
    compileOnly "curse.maven:polymorph-plus-1586874:${polymorph_plus_file_id}"
    compileOnly "curse.maven:polymorph-388800:${polymorph_classic_file_id}"
    if (polymorphMod == 'plus') {
        localRuntime "curse.maven:polymorph-plus-1586874:${polymorph_plus_file_id}"
        // Polymorphic AE2 hard-requires polymorph_plus — never pair with classic.
        localRuntime "curse.maven:polymorphic-ae2-1666854:${polymorphic_ae2_file_id}"
    } else if (polymorphMod == 'classic') {
        localRuntime "curse.maven:polymorph-388800:${polymorph_classic_file_id}"
        // Polymorphic Energistics targets classic polymorph (mod id polymorph).
        localRuntime "curse.maven:polymorphic-energistics-941096:${polymorphic_energistics_file_id}"
    }
    if (polymorphMod == 'plus' || polymorphMod == 'classic') {
        localRuntime "curse.maven:rs-polymorph-1492934:${rspolymorph_file_id}"
    }

    // Jade
    compileOnly "curse.maven:jade-324717:${jade_file_id}"
    localRuntime "curse.maven:jade-324717:${jade_file_id}"

    // Mekanism (Formulaic Assemblicator + QIO craft gates) — always as runtime dep when jar resolves
    compileOnly "curse.maven:mekanism-268560:${mekanism_file_id}"
    localRuntime "curse.maven:mekanism-268560:${mekanism_file_id}"

    // KubeJS (CurseMaven; API may also resolve from Latvian)
    compileOnly "curse.maven:kubejs-238086:${kubejs_file_id}"
    compileOnly "curse.maven:rhino-416294:${rhino_file_id}"
    localRuntime "curse.maven:kubejs-238086:${kubejs_file_id}"
    localRuntime "curse.maven:rhino-416294:${rhino_file_id}"

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation 'io.github.llamalad7:mixinextras-neoforge:0.4.1'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(
            '-AoutRefMapFile=' + layout.buildDirectory.file("${mod_id}.refmap.json").get().asFile.absolutePath,
            '-Amixin.configs=' + mod_id + '.mixins.json'
    )
}

tasks.named('jar', Jar).configure {
    def mid = project.mod_id
    from(layout.buildDirectory.file("${mid}.refmap.json")) {
        rename { "${mid}.refmap.json" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
